sonar.organization=soham2008xyz
sonar.projectKey=soham2008xyz_cs2-clone
sonar.projectName=cs2-clone

# SonarCloud's analysis scope now covers the whole repo (sonar.sources / sonar.tests
# have no effect), so keep tests and dev scripts out of the coverage metric explicitly
sonar.coverage.exclusions=**/test/**,scripts/**,**/vite.config.ts,**/vitest.config.ts

# Produced by `npm run test:coverage`; paths inside are relative to the repo root
sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info,packages/server/coverage/lcov.info,packages/client/coverage/lcov.info
