# Dependabot configuration
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      typescript-group:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # vitest and @vitest/* pin each other to the exact same version, so they
      # must move together on every update type, majors included.
      test-group:
        patterns:
          - "vitest"
          - "@vitest/*"
      vite-group:
        patterns:
          - "vite"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Phaser 4 is a renderer rewrite; migrating is a deliberate project, not a bump.
      - dependency-name: "phaser"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
