name: Landing Page

# Builds site/ (the static landing page) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md' # the controls table is generated from it
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No npm install: the site build and its tests use plain Node only.
      - name: Test site build
        run: npm run test:site

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        run: npm run build:site
        env:
          # Optional repo variable; build.mjs falls back to the live game URL.
          CS2D_GAME_URL: ${{ vars.CS2D_GAME_URL }}
          # Absolute base for og:image and canonical, so it follows a custom domain.
          CS2D_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional repo variable; empty uses the default GA4 property, "off" disables analytics.
          CS2D_GA_MEASUREMENT_ID: ${{ vars.CS2D_GA_MEASUREMENT_ID }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
