name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarCloud blame / new-code detection

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # No dependency lifecycle scripts: the only one (esbuild postinstall) is an
      # optional binary check — esbuild works from its platform optional dep alone.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Typecheck
        run: npm run typecheck

      - name: Run integration tests
        run: npm run test:integration

      - name: Build server
        run: npm run build -w @cs2d/server

      - name: Build client
        run: npm run build -w @cs2d/client

      # Scanner plugins and analyzers; skipped with the scan when there is no token
      - name: Cache SonarCloud packages
        if: matrix.node-version == 24 && env.SONAR_TOKEN != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Skipped when SONAR_TOKEN is unavailable (e.g. PRs from forks)
      - name: SonarCloud scan
        if: matrix.node-version == 24 && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
