name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarCloud blame / new-code detection

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Typecheck client
        run: npm run typecheck -w @cs2d/client

      - name: Run integration tests
        run: npm run test:integration

      - name: Build server
        run: npm run build -w @cs2d/server

      - name: Build client
        run: npm run build -w @cs2d/client

      # Skipped when SONAR_TOKEN is unavailable (e.g. PRs from forks)
      - name: SonarCloud scan
        if: matrix.node-version == 22 && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
